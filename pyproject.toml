[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-drowsiness-detection-system"
version = "0.1.0"
description = "Driver drowsiness detection using OpenCV, dlib facial landmarks, EAR, MAR, and head-tilt heuristics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlib-bin==20.0.1",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "PyYAML==6.0.2",
    "sounddevice==0.5.2",
    "soundfile==0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.8",
]

[project.scripts]
driver-drowsiness = "driver_drowsiness.app:main"

[tool.setuptools]
packages = ["driver_drowsiness"]
py-modules = ["Drowsiness_Detection"]

[tool.setuptools.package-dir]
driver_drowsiness = "src/driver_drowsiness"

[tool.setuptools.data-files]
"share/driver-drowsiness-detection-system" = [
    "config.yml",
    "shape_predictor_68_face_landmarks.dat",
    "loud_alarm.wav",
]

[tool.ruff]
target-version = "py312"
line-length = 88
